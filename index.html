<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Catálogo online de Emitos Peluquería Canina" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; font-src 'self'; media-src 'none'; object-src 'none'; frame-src 'none'; worker-src 'none'; base-uri 'none'; form-action 'none'; upgrade-insecure-requests;" />
  <meta name="referrer" content="no-referrer" />
  <title>Emitos Peluquería Canina | Catálogo</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-content">
      <div class="brand-block">
        <img class="brand-logo" src="assets/logo-emitos.webp" alt="Logo de Emitos Dog's Barbershop" width="900" height="374" />
        <div class="brand-copy">
          <p class="eyebrow">Catálogo online</p>
          <h1 id="shop-name">Emitos Peluquería Canina</h1>
          <p class="subtitle">Elegí tus productos y mandanos el pedido por WhatsApp.</p>
          <a class="instagram-link" href="https://www.instagram.com/emitospeluqueriacanina" target="_blank" rel="noopener noreferrer external" aria-label="Abrir Instagram de Emitos Peluquería Canina">Instagram · @emitospeluqueriacanina</a>
        </div>
      </div>
      <button id="cart-button" class="cart-button" type="button" aria-label="Abrir carrito">🛒 <span>Carrito</span><span id="cart-count" class="cart-count">0</span></button>
    </div>
  </header>
  <main class="container">
    <section class="controls" aria-label="Filtros del catálogo">
      <input id="search-input" class="search-input" type="search" placeholder="Buscar producto, marca o presentación..." aria-label="Buscar producto" maxlength="80" autocomplete="off" />
      <div id="category-filters" class="category-filters" aria-label="Categorías"></div>
      <div class="secondary-filters"><label><span>Tipo</span><select id="animal-filter"><option value="Todos">Todos</option></select></label><label><span>Marca</span><select id="brand-filter"><option value="Todas">Todas</option></select></label></div>
    </section>
    <section><p id="results-summary" class="results-summary" aria-live="polite"></p><div id="product-grid" class="product-grid"></div><p id="empty-state" class="empty-state hidden">No encontramos productos con esos filtros.</p></section>
  </main>
  <aside id="cart-drawer" class="cart-drawer" aria-hidden="true"><div class="cart-panel"><div class="cart-header"><h2>Tu pedido</h2><button id="close-cart" class="icon-button" type="button" aria-label="Cerrar carrito">✕</button></div><div id="cart-items" class="cart-items"></div><div class="cart-footer"><div class="cart-total-row"><span>Total</span><strong id="cart-total">$0</strong></div><label class="field-label" for="customer-name">Tu nombre</label><input id="customer-name" class="customer-input" type="text" placeholder="Ej: Juan" maxlength="60" autocomplete="name" required /><label class="field-label" for="customer-notes">Aclaraciones</label><textarea id="customer-notes" class="customer-input" rows="3" placeholder="Ej: entregar por la tarde" maxlength="300"></textarea><button id="whatsapp-button" class="whatsapp-button" type="button" disabled>Enviar pedido por WhatsApp</button><p class="helper-text">El pedido y el precio final se confirman por WhatsApp.</p></div></div></aside>
  <div id="backdrop" class="backdrop hidden"></div>
  <footer class="site-footer"><div class="container"><p>© <span id="year"></span> <span id="footer-shop-name">Emitos Peluquería Canina</span></p></div></footer>
  <script src="productos.js"></script><script src="app.js"></script>
</body>
</html>
